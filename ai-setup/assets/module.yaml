code: ai
name: AI Lifecycle
description: Agentic team for the full AI/ML project lifecycle — from domain research through production inference. Covers deep learning, classical ML, gradient boosting, transformers, and beyond.
version: 5.0.0

module_greeting: |
  AI Lifecycle is installed! Your agentic ML team is ready.

  Start a new project: ai-setup new-project
  Or dive straight into research: ai-agent-domain-expert domain-research

  Run /bmad-help anytime to navigate the lifecycle.

agents:
  - code: domain-expert
    name: Alex
    title: AI Domain Expert
    description: Deeply understands the problem domain via active research, frames research questions, and defines real-world success criteria.
  - code: data-engineer
    name: Sam
    title: AI Data Engineer
    description: Performs EDA, data cleaning, and builds pipelines from raw data to model-ready format.
  - code: researcher
    name: Maya
    title: AI Researcher
    description: In charge of architectural decisions, experiment result analysis, and team leadership.
  - code: mlops-engineer
    name: Kai
    title: ML/MLOps Engineer
    description: Writes pre-experiment contracts, builds training/fit pipelines and eval harnesses, and creates production inference pipelines.
  - code: experimentation-engineer
    name: Jordan
    title: Experimentation Engineer
    description: Executes model training runs and HPO across any paradigm — epoch-based DL, boosting rounds, or fit/predict loops.

variables:
  - key: ai_output_folder
    prompt: Where should lifecycle documents be saved? (relative to project root, e.g. "docs")
    default: docs
    result_template: "{project-root}/{value}"
    user_setting: false

  - key: ai_llm_provider
    prompt: LLM provider for analysis scripts?
    type: single-select
    options:
      - value: anthropic
        label: Anthropic API
      - value: openai-compatible
        label: OpenAI-compatible API (OpenAI, Ollama, vLLM, Azure, ...)
    default: anthropic
    user_setting: false

  - key: ai_llm_model
    prompt: Model name for analysis scripts? (e.g. claude-sonnet-4-6, gpt-4o, llama3.3)
    default: ""
    user_setting: false

  - key: ai_experiment_tracker
    prompt: Experiment tracking platform?
    type: single-select
    options:
      - value: none
        label: None
      - value: wandb
        label: Weights & Biases
      - value: mlflow
        label: MLflow
      - value: clearml
        label: ClearML
    default: none
    user_setting: false

  - key: ai_internal_sources
    prompt: Which internal knowledge sources exist for this project? (multi-select)
    type: multi-select
    options:
      - jira
      - confluence
      - sharepoint
      - network_share
      - none
    default: none
    user_setting: false
    # Written as a map. Per selected source, configure records:
    #   mode: mcp | export      (mcp when a server is recorded in ai_mcp_servers for it;
    #                            sharepoint defaults to export unless the org provides a server)
    #   scope: free text        (Jira project keys, Confluence space keys, share mount path,
    #                            SharePoint library) — confirmed once per research run
    #   server: <name>          (mode mcp only — the exact server name from ai_mcp_servers)

  - key: ai_mcp_servers
    prompt: >-
      MCP servers for internal sources? Auto-detected first; then confirm and add any
      internal servers the detection cannot see — give the EXACT server name as registered
      in your IDE/MCP config plus the source it serves. Air-gapped networks often run their
      own internal MCP servers (mirrors/gateways) — never assume air-gapped means no MCP.
    default: auto
    user_setting: false
    # Stored as a map of source -> exact registered server name,
    # e.g. {jira: mcp__atlassian, confluence: mcp__atlassian, docs: mcp__filesystem,
    #       arxiv: mcp__internal-arxiv-mirror}.
    # Value "none" means no MCP anywhere — every source falls back to export mode.

  - key: ai_tracker_url
    prompt: Tracker server URL? (self-hosted MLflow/ClearML/W&B; blank = SaaS default)
    default: ""
    user_setting: false

  - key: ai_tracker_offline
    prompt: Force tracker offline mode? (air-gapped or no server yet)
    type: single-select
    options: [auto, "true", "false"]
    default: auto
    user_setting: false

directories:
  - "{ai_output_folder}"
  - "{ai_output_folder}/research"
  - "{ai_output_folder}/eda"
  - "{ai_output_folder}/architecture"
  - "{ai_output_folder}/design"
  - "{ai_output_folder}/experiments"
  - "{ai_output_folder}/implementation"
  - "{ai_output_folder}/advisory"
  - "{ai_output_folder}/revisions"
  - "{ai_output_folder}/deployment"
  - "{ai_output_folder}/memory"
  - "{ai_output_folder}/memory/entries"
  # Export drop-folders — created only for sources whose mode is export
  # (ai-setup SKILL Step 4 filters by ai_internal_sources); gitignored by default.
  - "{project-root}/imports"
  - "{project-root}/imports/jira"
  - "{project-root}/imports/confluence"
  - "{project-root}/imports/sharepoint"
  - "{project-root}/imports/docs"

post_install_notes: |
  Next steps:
  - Run 'ai-setup new-project' to scaffold a new AI project, OR
  - Invoke 'ai-agent-domain-expert' directly on an existing project
  - Use '/bmad-help' anytime for lifecycle navigation
